# JRock in a browser, photographed in one: a desktop tab, and two phones.
#
# WHY A DEPLOYED ADDRESS AND NOT THE BUNDLE JUST BUILT. The page runs JRock through
# CheerpJ, which fetches its own runtime over the network and wants a page served the way
# a page is served; driven against a loopback server on a desktop it initialises and then
# the JVM exits before anything is painted (see WebShots.java). The deployed site does
# work - it is what the browser section of the README is about - so that is what these
# pictures are of. They show what is deployed rather than the jar built by this run, and
# that is the honest trade: a real picture of a real phone against a slightly older jar.
#
# The address ends in "?home": the page reads its query string as the folder to work in
# and STARTS BY ITSELF when there is one (see autostartDir in jrock-web/index.html), so
# nothing here has to find a button and press it. A phone screenshot of a page that
# started on its own is also a fair picture of what a reader will get from the same link.
#
# Manual, because an emulator and a simulator are minutes each and nothing in the program
# changes what they show. Run it when the browser pictures need refreshing.
name: Web and mobile screenshots

on:
  workflow_dispatch:
    inputs:
      url:
        description: The address to open (its query string is the working folder)
        default: https://jrock.nosocial.net/?home
      wait:
        description: Seconds to let CheerpJ download its runtime and paint the window
        default: '150'

jobs:
  web:
    name: A desktop browser tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # The same tool that serves the page locally, pointed at the deployed one instead
      # (--url). Under Xvfb because it drives a real browser rather than a headless one:
      # headless Chromium runs the page, fetches the jar, initialises CheerpJ and then the
      # JVM exits before anything is painted - which is the whole reason these pictures
      # come from a deployed address.
      #
      # Three scenes: the window in a tab, the /files browser with a real __JRock in it,
      # and the page on a phone-sized screen with a long press - the last two are the same
      # tool's mobile scenes, which the iOS and Android jobs below then show on real ones.
      - name: Drive the deployed page
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          mkdir -p screenshots
          # WITHOUT THE QUERY, deliberately. A folder in the address starts JRock the
          # moment the jar has loaded, and the first scene wants the page's own chrome
          # box unticked BEFORE that happens - the page reads it once, as the run begins.
          # So the tool presses Run itself here, and the phones below keep the ?home that
          # starts it for them.
          BASE='${{ inputs.url }}'
          BASE="${BASE%%\?*}"
          echo "driving $BASE"
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            java .github/build/WebShots.java screenshots --url "$BASE" || true
          ls -la screenshots/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: web-desktop
          path: screenshots/
          if-no-files-found: error

  ios:
    name: iOS Safari, in the Simulator
    runs-on: macos-latest
    steps:
      # Checked out for one file: LongPress.java, which is how the finger is held down on
      # a device screen that is a window on this runner's desktop.
      - uses: actions/checkout@v5

      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # Apple's own tooling, which is on this runner already: no account, no signing, no
      # third-party action. simctl boots a simulator, opens a URL in its Safari and reads
      # the screen back - the three things this needs and nothing else.
      - name: Boot the newest iPhone the runner has
        run: |
          xcrun simctl list devices available | sed -n '1,40p'
          UDID=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' \
                 | tail -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then echo "::error::no iPhone simulator on this runner"; exit 1; fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Open JRock and photograph it
        run: |
          mkdir -p screenshots
          open -a Simulator            # the device screen has to be a window to press on
          xcrun simctl openurl "$UDID" "${{ inputs.url }}"
          # The first picture is taken early on purpose: the page's own log, which says
          # what it is doing while the runtime comes down, is the one thing a reader
          # waiting on a slow connection will see.
          sleep 25
          xcrun simctl io "$UDID" screenshot screenshots/ios-01-starting.png
          sleep ${{ inputs.wait }}
          xcrun simctl io "$UDID" screenshot screenshots/ios-02-the-window.png

          # AND THE LONG PRESS, which is how a menu opens where there is no right button
          # to click - the one thing about JRock on a phone that a picture of the window
          # cannot show. The press is the host's mouse held over the Simulator's window
          # (see LongPress.java); the picture is still the device's own screen, so the
          # menu is in it and the Simulator's chrome is not.
          java .github/build/LongPress.java 0.5 0.55 900 || true
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/ios-03-the-touch-menu.png
          ls -la screenshots/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: mobile-ios
          path: screenshots/
          if-no-files-found: error

  android:
    name: Android Chrome, in the emulator
    runs-on: ubuntu-latest
    steps:
      # KVM, which the Linux runners have but do not open to the job's own user. Without
      # it the emulator falls back to software and takes long enough to be useless.
      - name: Let this job use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm-for-this-job.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Google's own tooling, also already on the runner: sdkmanager, avdmanager, the
      # emulator and adb. One system image, one device, no action from the marketplace.
      - name: An emulator, booted
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              -n jrock -k "system-images;android-34;google_apis;x86_64" --device pixel_6 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd jrock -no-window -no-audio \
              -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          # Booted means sys.boot_completed, not "adb answered": Chrome cannot be started
          # before the framework is up.
          timeout 420 bash -c 'until [ "$('"$ANDROID_HOME"'/platform-tools/adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          "$ANDROID_HOME/platform-tools/adb" shell wm size
          "$ANDROID_HOME/platform-tools/adb" shell settings put system font_scale 1.0

      - name: Open JRock and photograph it
        run: |
          mkdir -p screenshots
          ADB="$ANDROID_HOME/platform-tools/adb"
          $ADB shell am start -a android.intent.action.VIEW -d '${{ inputs.url }}' > /dev/null
          sleep 25
          $ADB exec-out screencap -p > screenshots/android-01-starting.png
          sleep ${{ inputs.wait }}
          $ADB exec-out screencap -p > screenshots/android-02-the-window.png

          # The long press, which here is simply a swipe that does not move: input goes to
          # the device, so no window of anybody's has to be found first. The middle of the
          # screen is inside JRock's log, which is the menu worth opening.
          SIZE=$($ADB shell wm size | tr -d '\r' | awk -F'[: x]+' '{print $(NF-1), $NF}')
          X=$(echo $SIZE | awk '{print int($1/2)}')
          Y=$(echo $SIZE | awk '{print int($2/2)}')
          echo "long press at $X,$Y of $SIZE"
          $ADB shell input swipe $X $Y $X $Y 900
          sleep 2
          $ADB exec-out screencap -p > screenshots/android-03-the-touch-menu.png
          ls -la screenshots/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: mobile-android
          path: screenshots/
          if-no-files-found: error
