# JRock in a browser, photographed in one: a desktop tab, and a phone.
#
# TWO WAYS IN, AND THE BETTER ONE FIRST. The desktop job serves THIS BUILD'S bundle - the
# page and the jar that were just made - and drives the program through the page's library
# mode: "#shots" in the address runs the jar as a library and hands the JRock class to
# JavaScript, so the tool calls the automation API (the same calls a flow makes) instead
# of pressing at pixels, and a Java exception arrives with its message rather than as
# "exited with code 1". That is a picture of this build, which is what a screenshot in a
# README should be.
#
# If that comes back with nothing, it falls back to the DEPLOYED page, which is known to
# work - a true picture of a slightly older jar beats no picture of this one. The iOS job
# has no choice in the matter: a phone cannot be handed a bundle off this runner, so it
# opens the deployed address, where "?home" is the folder to work in and also makes the
# page start by itself (see autostartDir in jrock-web/index.html) - which is what a reader
# gets from the same link.
#
# Android is not here on purpose. It is the same page, the same canvas and the same menu
# as iOS, one status bar apart: a second picture of the first.
name: Web and mobile screenshots

on:
  push:
  workflow_dispatch:
    inputs:
      url:
        description: The address a phone opens (its query string is the working folder)
        default: https://jrock.nosocial.net/?home
      wait:
        description: Seconds to let CheerpJ download its runtime and paint the window
        default: '150'

env:
  # A push carries no inputs, so every use of them falls back to these.
  URL: ${{ inputs.url || 'https://jrock.nosocial.net/?home' }}
  WAIT: ${{ inputs.wait || '150' }}

jobs:
  web:
    name: A desktop browser tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build the jar this page will run
        run: |
          javac -encoding UTF-8 --release 11 -g:source,lines,vars -d out JRock.java
          java .github/build/BuildJar.java

      # Xvfb because the tool drives a real browser and not a headless one: headless
      # Chromium runs the page, fetches the jar, initialises CheerpJ - and then the JVM
      # exits before anything is painted.
      - name: Drive this build's page, then the deployed one if it has to
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          mkdir -p screenshots
          shots() { xvfb-run -a --server-args="-screen 0 1600x1200x24" \
                      java .github/build/WebShots.java screenshots "$@" || true; }

          shots
          if [ -z "$(ls screenshots/*.png 2>/dev/null)" ]; then
            # Without the query: a folder in the address starts JRock the moment the jar
            # has loaded, and the first scene wants the page's own chrome box unticked
            # BEFORE that happens, so the tool presses Run itself.
            BASE="${URL%%\?*}"
            echo "nothing from this build's own page; falling back to $BASE"
            shots --url "$BASE"
          fi
          ls -la screenshots/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: web-desktop
          path: screenshots/
          if-no-files-found: error

  ios:
    name: iOS Safari, in the Simulator
    runs-on: macos-latest
    steps:
      # Checked out for one file: LongPress.java, which is how the finger is held down on
      # a device screen that is a window on this runner's desktop.
      - uses: actions/checkout@v5

      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # Apple's own tooling, which is on this runner already: no account, no signing, no
      # third-party action. simctl boots a simulator, opens a URL in its Safari and reads
      # the screen back - the three things this needs and nothing else.
      - name: Boot the newest iPhone the runner has
        run: |
          xcrun simctl list devices available | sed -n '1,40p'
          UDID=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' \
                 | tail -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then echo "::error::no iPhone simulator on this runner"; exit 1; fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Open JRock and photograph it
        run: |
          mkdir -p screenshots
          open -a Simulator            # the device screen has to be a window to press on
          xcrun simctl openurl "$UDID" "$URL"
          # The first picture is taken early on purpose: the page's own log, which says
          # what it is doing while the runtime comes down, is the one thing a reader
          # waiting on a slow connection will see.
          sleep 25
          xcrun simctl io "$UDID" screenshot screenshots/ios-01-starting.png
          sleep $WAIT
          xcrun simctl io "$UDID" screenshot screenshots/ios-02-the-window.png

          # AND THE LONG PRESS, which is how a menu opens where there is no right button
          # to click - the one thing about JRock on a phone that a picture of the window
          # cannot show. The press is the host's mouse held over the Simulator's window
          # (see LongPress.java); the picture is still the device's own screen, so the
          # menu is in it and the Simulator's chrome is not.
          java .github/build/LongPress.java 0.5 0.55 900 || true
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/ios-03-the-touch-menu.png
          ls -la screenshots/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: mobile-ios
          path: screenshots/
          if-no-files-found: error
