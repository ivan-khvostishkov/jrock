name: Screenshots

# The README's screenshots, taken by the program they are of - on all three desktops.
#
# WHY THIS IS A BUILD STEP. A screenshot pasted into a README is a claim about what the
# program looks like, and it stops being true the moment anything moves: a renamed button,
# a reworded line, a window that grew a row. These are taken by DRIVING the real program
# through its own automation API and then painting its window, so a picture that is out of
# date is a build that is out of date. Nothing is staged.
#
# WHY THREE OPERATING SYSTEMS. Swing takes its look from the platform, so one window is
# three pictures - and a README can then show one program rather than one platform, with
# the file names saying which runner each came from. Pick whichever mix illustrates a
# section best; the artifact holds all of them.
#
# No credentials, and no network. Two scenes need an answer in the log, and those answers
# are RECORDED: each was asked once of the real endpoint from a folder with a key, and the
# reply and its usage block were copied into Screenshots.java. The step runs a Chat
# Completions endpoint of its own on the LOOPBACK address that replays them, so the
# pictures show what the model really said while nothing leaves the runner and nothing
# here can cost anything.
#
# Painting and not java.awt.Robot: Robot photographs the SCREEN, which on a macOS runner
# needs the screen-recording permission nobody can grant a CI job. printAll() asks the
# window to draw itself into an image, which works under xvfb and on every runner.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    strategy:
      fail-fast: false        # one desktop failing should not cost the other two
      matrix:
        include:
          # "under" is where the throwaway demo folder goes, and it is in the picture:
          # the session report prints the whole path, so /tmp/jrock-demo/Demo reads like
          # a demo where macOS's own temp folder reads like a crash dump. Windows takes
          # its default, the account's temp folder, since its pictures are for showing
          # that the window looks the same rather than for pasting paths into a README.
          - runner: ubuntu-latest
            name: linux
            under: /tmp
          - runner: macos-latest
            name: macos
            under: /tmp
          - runner: windows-latest
            name: windows
            # Not the account's temp folder: Windows writes it as C:\Users\RUNNER~1\...,
            # and an eight-dot-three short name in a session report is in the picture.
            under: 'C:/'

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # JDK 11 is JRock's documented minimum, and the screenshots should be of what the
      # minimum looks like rather than of whatever the newest JDK draws.
      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # The jar first, because the agents are compiled against it - the same two commands
      # the build workflow runs, so a screenshot is of the code that was just built.
      - name: Build the JAR and compile the agents
        shell: bash
        run: |
          javac -encoding UTF-8 --release 11 -g:source,lines,vars -d out JRock.java
          java .github/build/BuildJar.java
          javac -encoding UTF-8 --release 11 -cp jrock.jar -d out-automation \
                samples/agents/*.java samples/flows/*.java

      # INSTALLED FIRST, AND THEN PHOTOGRAPHED - which is the whole arrangement here,
      # and the reason it is one step. A user does not run JRock out of a build tree: they
      # run the installer, and then they run what it put in a folder. So that is what this
      # does, and every picture after the first two is of a real installation.
      #
      # It also fixes something no amount of copying could: an agent reads the prompt files
      # its own source names out of the folder it is running from, which for an installed
      # agent is its own folder under Agents/, with its prompts beside its .java. Run out
      # of a build tree it finds none of them and stops with a modal dialog nobody answers.
      #
      # Three passes, in this order:
      #   1. the installer, driven through its own wizard (and on Windows, Explorer's two
      #      menus with the entries it just wrote)
      #   2. the twelve program scenes, against the INSTALLED jar
      #   3. the five agents that need a process each, every one started from its own
      #      installed folder with its own .java named - which is what its shortcut does
      - name: Install JRock, then photograph the installation
        shell: bash
        run: |
          set -u
          if [ "${{ matrix.name }}" = "linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          fi
          # One place where the three differ, and then they do not differ again.
          case "${{ matrix.name }}" in
            windows) SEP=';' ;;
            *)       SEP=':' ;;
          esac
          run() {
            if [ "${{ matrix.name }}" = "linux" ]; then
              xvfb-run -a --server-args="-screen 0 1600x1200x24" "$@"
            else
              "$@"
            fi
          }

          # ONE PATH FORM FOR BOTH READERS, which cost a whole Windows run. RUNNER_TEMP
          # there is "D:\a\_temp" - backslashes - so "$RUNNER_TEMP/JRockShots" is a path
          # Java reads and bash cannot stat, and every [ -f ] against it answered no. The
          # fallback was then $PWD, which in Git bash is "/d/a/jrock/jrock" - a path bash
          # reads and the JVM cannot, so -cp found no JRock at all.
          #
          # pwd -W gives "D:/a/jrock/jrock": a drive letter and forward slashes, which
          # bash stats and the JVM loads. Everything below is built from it, and the
          # installation goes under it rather than in the runner's temp.
          HERE="$(pwd -W 2>/dev/null || pwd)"
          INSTALL="$HERE/install-shots"
          rm -rf "$INSTALL"
          mkdir -p screenshots

          # 1. The installer, which leaves the installation behind for the rest of this.
          javac -encoding UTF-8 --release 11 -d out-installer installer/InstallJRock.java
          # Without jrock.jar on the class path, which this tool does not use: a
          # command line with the jar in it is one the installer reads as a running
          # JRock, and it then offers to stop the very JVM driving it.
          run java -cp "$HERE/out-installer" \
               .github/build/InstallerShots.java screenshots ${{ matrix.name }} \
               "$INSTALL" --clean 2>&1 | tee installer.log || true
          # Where it really installed, which it prints rather than being told: the wizard
          # has a default of its own and a person would take it.
          INSTALLED=$(sed -n 's/^INSTALLED=//p' installer.log | tail -1)
          [ -n "$INSTALLED" ] && INSTALL="$INSTALLED"
          echo "--- what was installed, in $INSTALL"
          ls -la "$INSTALL" || true
          ls -la "$INSTALL/Agents" || true

          # The jar to photograph is the installed one from here on. If the wizard did not
          # get that far, the built one stands in - a picture of this build either way.
          JAR="$INSTALL/jrock.jar"
          if [ -f "$JAR" ]; then
            echo "--- the installed jar: $JAR"
          else
            JAR="$HERE/jrock.jar"
            echo "::warning::the wizard left no jar in $INSTALL; using the built one"
            echo "--- the built jar: $JAR"
          fi

          # The tool is COMPILED rather than source-launched, because the source launcher
          # sets jdk.launcher.sourcefile to the tool's own path - and that property is the
          # first thing an agent asks where its prompt files are.
          javac -encoding UTF-8 --release 11 -cp "$JAR" -d out-build \
                .github/build/Screenshots.java

          # 2. The program itself: twelve scenes, against the installed jar.
          run java -cp "$JAR${SEP}$HERE/out-automation${SEP}$HERE/out-build" Screenshots \
               screenshots ${{ matrix.name }} ${{ matrix.under }} || true
          echo "--- $(ls screenshots/*.png 2>/dev/null | wc -l) picture(s) after the program"

          # 3. Each agent, out of its own installed folder. The class is compiled from the
          # installed source, the working directory IS that folder (so PTTFiles/ and the
          # rest land where they would), and jdk.launcher.sourcefile names the installed
          # .java, which is what the single-file launcher would have set.
          for dir in "$INSTALL"/Agents/*/; do
            [ -d "$dir" ] || continue
            src=$(ls "$dir"*.java 2>/dev/null | head -1)
            [ -n "$src" ] || continue
            name=$(basename "$src" .java)
            echo "--- $name, from $dir"
            # The classes go to the runner's temp: an installation is what the installer
            # left behind, and this adds no folders of its own to it.
            CLASSES="$HERE/agent-classes/$name"
            mkdir -p "$CLASSES"
            javac -encoding UTF-8 --release 11 -cp "$JAR" -d "$CLASSES" "$src" || continue
            ( cd "$dir" && run java -Djdk.launcher.sourcefile="$src" \
                -cp "$JAR${SEP}$CLASSES${SEP}$HERE/out-build" Screenshots \
                "$HERE/screenshots" ${{ matrix.name }} ${{ matrix.under }} \
                --agent "$name" ) || true
          done
          echo "--- $(ls screenshots/*.png 2>/dev/null | wc -l) picture(s) in all"
          ls -la screenshots/

      # The twelve JRock scenes are the point of the step, and a missing one is a bug
      # rather than a runner's bad day - so they are counted. The agent windows and the
      # installer's pictures are not: each is started in the same JVM and skipped with a
      # reason if it cannot come up, which should not cost the pictures that did.
      - name: What was taken
        shell: bash
        run: |
          ls -la screenshots/
          taken=$(ls screenshots/*.png | wc -l)
          echo "$taken picture(s)"
          if [ "$taken" -lt 10 ]; then
            echo "::error::fewer than ten of the twelve JRock scenes were taken"
            exit 1
          fi

      - name: Upload the screenshots
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.name }}
          path: screenshots/
          if-no-files-found: error
