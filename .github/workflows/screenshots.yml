name: Screenshots

# The README's screenshots, taken by the program they are of - on all three desktops.
#
# WHY THIS IS A BUILD STEP. A screenshot pasted into a README is a claim about what the
# program looks like, and it stops being true the moment anything moves: a renamed button,
# a reworded line, a window that grew a row. These are taken by DRIVING the real program
# through its own automation API and then painting its window, so a picture that is out of
# date is a build that is out of date. Nothing is staged.
#
# WHY THREE OPERATING SYSTEMS. Swing takes its look from the platform, so one window is
# three pictures - and a README can then show one program rather than one platform, with
# the file names saying which runner each came from. Pick whichever mix illustrates a
# section best; the artifact holds all of them.
#
# No credentials, and no network. Two scenes need an answer in the log, and those answers
# are RECORDED: each was asked once of the real endpoint from a folder with a key, and the
# reply and its usage block were copied into Screenshots.java. The step runs a Chat
# Completions endpoint of its own on the LOOPBACK address that replays them, so the
# pictures show what the model really said while nothing leaves the runner and nothing
# here can cost anything.
#
# Painting and not java.awt.Robot: Robot photographs the SCREEN, which on a macOS runner
# needs the screen-recording permission nobody can grant a CI job. printAll() asks the
# window to draw itself into an image, which works under xvfb and on every runner.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    strategy:
      fail-fast: false        # one desktop failing should not cost the other two
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux
          - runner: macos-latest
            name: macos
          - runner: windows-latest
            name: windows

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # JDK 11 is JRock's documented minimum, and the screenshots should be of what the
      # minimum looks like rather than of whatever the newest JDK draws.
      - name: Set up OpenJDK 11 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # The jar first, because the agents are compiled against it - the same two commands
      # the build workflow runs, so a screenshot is of the code that was just built.
      - name: Build the JAR and compile the agents
        shell: bash
        run: |
          javac -encoding UTF-8 --release 11 -g:source,lines,vars -d out JRock.java
          java .github/build/BuildJar.java
          javac -encoding UTF-8 --release 11 -cp jrock.jar -d out-automation \
                samples/agents/*.java samples/flows/*.java

      # A display, on the one runner that has none. Xvfb is also what the GUI tests use.
      # The third argument is where the demo folder goes, and it is given here because the
      # session report prints that path INTO the picture: /tmp/jrock-demo/Demo rather than
      # macOS's own /var/folders/zz/.../T, which reads like a crash dump. Windows is left
      # with its default (the account's temp folder), since what its pictures are for is
      # showing that the window looks the same, not for pasting paths into a README.
      - name: Take the screenshots (Linux, under Xvfb)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            java -cp "jrock.jar:out-automation" .github/build/Screenshots.java \
                 screenshots ${{ matrix.name }} /tmp

      - name: Take the screenshots (macOS)
        if: matrix.runner == 'macos-latest'
        run: |
          java -cp "jrock.jar:out-automation" .github/build/Screenshots.java \
               screenshots ${{ matrix.name }} /tmp

      - name: Take the screenshots (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          java -cp "jrock.jar;out-automation" .github/build/Screenshots.java \
               screenshots ${{ matrix.name }}

      # THE OTHER FIVE AGENTS, one process each. Five of the seven start a JRock of
      # their own and then take it as an automation, and a process has one of each - so
      # they cannot be photographed beside the conversation above, or beside each other.
      # The timer and the paper docs agent drive nothing and are in the run above.
      #
      # One invocation per agent, and a missing picture is a line in the log: an agent
      # that wants a microphone, a Thunderbird profile or a Chromium says so and stops,
      # which is worth knowing and is not worth failing a build for.
      - name: The agents that need a process of their own (Linux, under Xvfb)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          for agent in push-to-talk geo weather thunderbird browser; do
            echo "--- $agent"
            xvfb-run -a --server-args="-screen 0 1600x1200x24" \
              java -cp "jrock.jar:out-automation" .github/build/Screenshots.java \
                   screenshots ${{ matrix.name }} /tmp --agent "$agent" || true
          done

      - name: The agents that need a process of their own (macOS)
        if: matrix.runner == 'macos-latest'
        run: |
          for agent in push-to-talk geo weather thunderbird browser; do
            echo "--- $agent"
            java -cp "jrock.jar:out-automation" .github/build/Screenshots.java \
                 screenshots ${{ matrix.name }} /tmp --agent "$agent" || true
          done

      - name: The agents that need a process of their own (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          for agent in push-to-talk geo weather thunderbird browser; do
            echo "--- $agent"
            java -cp "jrock.jar;out-automation" .github/build/Screenshots.java \
                 screenshots ${{ matrix.name }} --agent "$agent" || true
          done

      # THE INSTALLER, AND THE MENUS IT WRITES, on the one runner where either means
      # anything. The wizard is Swing, so it is driven the way JRock is - its real Next
      # button, its real radio button, its real ticks - and it really installs, because
      # Explorer's menu only has JRock's entries in it on a machine where JRock is
      # installed. --clean takes those entries out again afterwards; the runner is thrown
      # away either way, but the same command at a desk should leave nothing behind.
      #
      # The two Explorer pictures are the shell's own menus, opened with Shift+F10 rather
      # than a mouse click at a guessed pixel, and captured as the whole screen - which on
      # a runner holds one window and an empty desktop.
      - name: The installer and the Explorer menus (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          javac -encoding UTF-8 --release 11 -d out-installer installer/InstallJRock.java
          java -cp "jrock.jar;out-installer" .github/build/InstallerShots.java \
               screenshots ${{ matrix.name }} "$RUNNER_TEMP/JRockShots" --clean

      # The twelve JRock scenes are the point of the step, and a missing one is a bug
      # rather than a runner's bad day - so they are counted. The agent windows and the
      # installer's pictures are not: each is started in the same JVM and skipped with a
      # reason if it cannot come up, which should not cost the pictures that did.
      - name: What was taken
        shell: bash
        run: |
          ls -la screenshots/
          taken=$(ls screenshots/*.png | wc -l)
          echo "$taken picture(s)"
          if [ "$taken" -lt 10 ]; then
            echo "::error::fewer than ten of the twelve JRock scenes were taken"
            exit 1
          fi

      - name: Upload the screenshots
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-${{ matrix.name }}
          path: screenshots/
          if-no-files-found: error
