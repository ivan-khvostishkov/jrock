name: Reproducible build

# Builds JRock.java with a PINNED OpenJDK 11 patch into a byte-for-byte
# reproducible JAR. The same source produces the same JAR (identical SHA-256 and
# MD5) on any machine or OS, because BuildJar.java repacks the classes
# deterministically (sorted entries, fixed timestamps, fixed compression, a
# hand-written manifest). Everything is Java - no Python or shell packing.
#
# The job runs on Windows, macOS and Linux; every runner uploads its own
# checksums, which must all match to prove reproducibility.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Pin the EXACT JDK 11 patch (Temurin 11.0.32+9, the latest LTS quarterly
      # update). Reproducibility depends on the exact toolchain, so this is fixed
      # rather than a floating "11".
      - name: Set up OpenJDK 11.0.32+9 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11.0.32+9'

      - name: Show Java version
        run: javac -version

      - name: Compile
        # -encoding UTF-8   : fixed source charset (no platform-default variance).
        # --release 11      : pins the target class-file version + platform API,
        #                     independent of the running JDK's default.
        # -g:source,lines,vars : pin the debug attributes emitted (all source-
        #                     derived, so deterministic) instead of relying on the
        #                     compiler's default -g level.
        # javac itself embeds no timestamps or paths, so with a pinned JDK the
        # resulting .class bytes are identical on any machine/OS.
        run: javac -encoding UTF-8 --release 11 -g:source,lines,vars -d out JRock.java

      - name: Build reproducible JAR (+ checksums + source zip)
        # Run from the repo root (default) so BuildJar's relative paths (out/,
        # JRock.java, jrock.jar) resolve there; the tool source lives in .github/build.
        run: java .github/build/BuildJar.java

      # The samples in samples/agents/ (which loop) and samples/flows/ (which run once)
      # are run as `java -cp jrock.jar Sample.java` against a jar the installer puts in
      # place, so they are compiled here against the jar this job just built - which
      # checks both that they compile and that the public automation API they call is in
      # the jar. After the jar step for that reason, and the classes go to a directory of
      # their own, outside both the jar and the source zip.
      - name: Compile the agents and flows against the JAR
        shell: bash
        run: |
          javac -encoding UTF-8 --release 11 -cp jrock.jar \
                -d out-automation samples/agents/*.java samples/flows/*.java

      # The installer is a single source file run as "java InstallJRock.java" from the
      # unpacked artifact, so it is never compiled by anybody - which is exactly why it
      # is compiled here. It depends on nothing but the JDK: no jar on the class path,
      # because it is what puts the jar where it belongs.
      - name: Compile the installer
        shell: bash
        run: |
          javac -encoding UTF-8 --release 11 -d out-installer installer/InstallJRock.java
          java installer/InstallJRock.java --check

      # Copied to the root of the artifact, beside the jar: whoever unpacks a release
      # should be able to run "java InstallJRock.java" where they stand, without first
      # working out which subfolder it came in.
      - name: Put the installer beside the jar
        shell: bash
        run: cp installer/InstallJRock.java InstallJRock.java

      - name: Show checksums (job summary)
        shell: bash
        run: |
          {
            echo "### Reproducible build on ${{ matrix.os }} (JDK 11.0.32+9)"
            echo '```'
            cat jrock.jar.sha256
            cat jrock.jar.md5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jrock-${{ matrix.os }}
          # jar + its checksums side by side, the installer that puts them somewhere,
          # plus the zipped source and the samples - prompts, agents and flows (which are
          # inside jrock-src.zip as well, and loose here so they can be read without
          # unpacking anything).
          path: |
            jrock.jar
            jrock.jar.sha256
            jrock.jar.md5
            InstallJRock.java
            jrock-src.zip
            samples/
          if-no-files-found: error

      # The README as a DOCX, written by the program the README is about: JRock's own
      # Markdown export, driven through its own automation API (see
      # .github/build/ReadmeDocx.java). Named paragraph styles are the reason that export
      # is DOCX and not RTF, and the reason this step exists - the document comes out with
      # Word's own Heading 1..6, Normal, Code, Quote and Hyperlink, in Calibri and
      # Consolas, which is what a layout application maps onto its own styles. Nothing is
      # installed: no pandoc, no LaTeX, and no second Markdown dialect to keep in step
      # with the first.
      #
      # The seven mermaid diagrams are rendered to PNGs on the way in, by mermaid-cli
      # through npx - GitHub draws them itself in the README and a word processor cannot,
      # so without this they would arrive as source in a monospaced font. It is the one
      # outside tool in this build: Node and Chrome are both on this runner already, the
      # tool is asked for rather than installed, and a step that cannot reach it leaves
      # the blocks as they are and still writes the document.
      #
      # Linux only, because one document is enough and the jar is identical on all three
      # runners - and under xvfb, because the export goes through the window: JRock drives
      # its real prompt and its real exporter, so this step is a check on both.
      - name: Build the README as a DOCX
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1600x1200x24" \
            java -cp jrock.jar .github/build/ReadmeDocx.java README.md README.docx book
          ls -l README.docx
          ls -l book/ | head -5

      - name: Upload the README DOCX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          # One file: place it in a primary text frame and map the five style names.
          name: readme-docx
          path: README.docx
          if-no-files-found: error

      # The same document as a BOOK: one DOCX per chapter - 00-front-matter.docx, then
      # 01- to 37-, each named for the section mark the text itself uses, so "§14" in a
      # sentence is 14-settings-files.docx in this folder. That is what InDesign's Book
      # panel takes: one document per chapter, numbered by the panel, with one table of
      # contents and one index built across the lot - and what lets InCopy have an
      # editor in one chapter while another is being typeset.
      - name: Upload the README as a book of chapters
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: readme-book
          path: book/
          if-no-files-found: error

      # Assemble the CheerpJ web bundle for Amplify: a flat directory with
      # index.html and jrock.jar at the root (no subdirectory). The page fetches
      # ./jrock.jar over HTTP and verifies its SHA-256/MD5 in the browser.
      # Built once (on Linux) since the jar is reproducible across all runners.
      - name: Assemble jrock-web bundle
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rm -rf jrock-web-dist
          mkdir jrock-web-dist
          cp jrock-web/index.html jrock-web-dist/index.html
          cp jrock.jar            jrock-web-dist/jrock.jar

      - name: Upload jrock-web bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          # Downloading this artifact yields jrock-web.zip with index.html and
          # jrock.jar at its root - ready to deploy to Amplify.
          name: jrock-web
          path: jrock-web-dist/
          if-no-files-found: error
